name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  core:
    name: core (lib) — fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (core, all features)
        run: cargo clippy --locked --profile ci -p rubic-core --all-targets --all-features
      - name: Test (core, default)
        run: cargo test --locked --profile ci -p rubic-core
      - name: Test (core, optimal feature)
        run: cargo test --locked --profile ci -p rubic-core --features optimal

  app:
    name: app (bevy, ${{ matrix.name }}) — clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: camera
            features: camera
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.name }}
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev \
            libxkbcommon-dev
      - name: Clippy (app)
        run: cargo clippy --locked --profile ci -p rubic --all-targets --features "${{ matrix.features }}"
      - name: Test (app)
        run: cargo test --locked --profile ci -p rubic --features "${{ matrix.features }}"
